# Broker local para la captura biométrica.
#
# Mosquitto 2.x solo escucha en localhost por defecto y rechaza conexiones anónimas.
# El ESP32 llega por la red local, así que hay que abrir ambas cosas explícitamente.
#
#   mosquitto -c tesis/bio/mosquitto.conf -v
#
# Esto deja el broker abierto a cualquiera en la red local. Es aceptable para una sesión
# de laboratorio en una red controlada; no lo expongas a una red abierta ni a internet.

listener 1883 0.0.0.0
allow_anonymous true

# Sin persistencia: los datos los guarda el suscriptor, no el broker.
persistence false
